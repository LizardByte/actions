---
name: "Organization sync"
description: "Sync shared files, property schemas, organization policies, variables, and supplied secrets."
author: "LizardByte"

branding:
  icon: copy
  color: green

inputs:
  admin_config:
    description: >-
      Optional path to a combined policy or a separate administration policy; enables organization administration.
    required: false
    default: ''
  admin_token:
    description: 'Optional organization administration credential; falls back to token.'
    required: false
    default: ''
  branch:
    description: 'Dedicated bot branch used for one sync pull request per repository.'
    required: false
    default: 'bot/org-sync-files'
  concurrency:
    description: 'Maximum number of organizations or repositories processed concurrently, from 1 to 10.'
    required: false
    default: '3'
  config:
    description: 'Path to a combined policy or a separate file replication policy, relative to source_directory.'
    required: false
    default: '.github/file-sync.json'
  dry_run:
    description: 'Plan all selected operations without writing organization or repository state.'
    required: false
    default: 'false'
  organization:
    description: 'Limit this run to one organization already present in organizations_file.'
    required: false
    default: ''
  organizations_file:
    description: 'JSON array of allowed organization names, relative to source_directory.'
    required: false
    default: 'organizations.json'
  pr_title:
    description: 'Title for synchronization commits and pull requests.'
    required: false
    default: 'chore: sync shared files'
  properties_file:
    description: 'Optional path to a combined policy or separate property definitions; enables schema reconciliation.'
    required: false
    default: ''
  repository:
    description: 'Limit this run to one configured owner/repository without enumerating the organization.'
    required: false
    default: ''
  source_directory:
    description: 'Directory containing the trusted source files and policy. Defaults to the workflow workspace.'
    required: false
    default: ${{ github.workspace }}
  source_token:
    description: 'Optional credential for reading variables/settings from source_organization.'
    required: false
    default: ''
  secret_values:
    description: 'JSON map of supplied secret values, referenced by value_key in admin_config. Never commit this map.'
    required: false
    default: ''
  sync_files:
    description: 'Enable file replication. Set false for an administration-only job.'
    required: false
    default: 'true'
  sync_mode_property:
    description: 'Single-select repository custom property with included/excluded values.'
    required: false
    default: 'sync_mode'
  token:
    description: 'File delivery credential; also used for administration when admin_token is omitted.'
    required: false
    default: ''
  workflow_profiles_property:
    description: 'Multi-select repository custom property whose values match file rule profiles.'
    required: false
    default: 'workflow_profiles'

outputs:
  organization_results:
    description: 'JSON organization plans/results. Secret and variable values are omitted.'
    value: ${{ steps.admin.outputs.organization_results }}
  changed_organizations:
    description: 'Number of organizations updated or reporting planned administration changes.'
    value: ${{ steps.admin.outputs.changed_organizations }}
  failed_organizations:
    description: 'Number of organizations whose administration failed.'
    value: ${{ steps.admin.outputs.failed_organizations }}
  changed_repositories:
    description: 'Number of repositories updated, closed, or reporting planned changes.'
    value: ${{ steps.sync.outputs.changed_repositories }}
  failed_repositories:
    description: 'Number of repositories that failed synchronization.'
    value: ${{ steps.sync.outputs.failed_repositories }}
  results:
    description: 'JSON array of per-repository results and planned file changes. Private target details are omitted.'
    value: ${{ steps.sync.outputs.results }}
  report_file:
    description: 'Runner-local path to the JSON report, including source, mode, scope, and per-target results.'
    value: ${{ steps.report.outputs.report_file }}
  artifact_name:
    description: 'Unique name of the JSON report artifact uploaded by this invocation.'
    value: ${{ steps.report.outputs.artifact_name }}

runs:
  using: "composite"
  steps:
    - name: Install secret encryption library
      id: runtime
      if: inputs.admin_config != '' && inputs.dry_run == 'false'
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "${ACTION_DIRECTORY}"

    - name: Synchronize organization configuration
      id: admin
      env:
        INPUT_ADMIN_CONFIG: ${{ inputs.admin_config }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_ORGANIZATIONS_FILE: ${{ inputs.organizations_file }}
        INPUT_PROPERTIES_FILE: ${{ inputs.properties_file }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SECRET_VALUES: ${{ inputs.secret_values }}
        INPUT_SOURCE_DIRECTORY: ${{ inputs.source_directory }}
        INPUT_SOURCE_TOKEN: ${{ inputs.source_token }}
        INPUT_SYNC_FILES: ${{ inputs.sync_files }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        github-token: ${{ inputs.admin_token || inputs.token || github.token }}
        retries: 3
        script: |
          const script = require('${{ github.action_path }}/admin.js');
          await script({ github, core });

    - name: Synchronize files
      id: sync
      if: inputs.sync_files == 'true'
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_ORGANIZATIONS_FILE: ${{ inputs.organizations_file }}
        INPUT_PR_TITLE: ${{ inputs.pr_title }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_SOURCE_DIRECTORY: ${{ inputs.source_directory }}
        INPUT_SYNC_MODE_PROPERTY: ${{ inputs.sync_mode_property }}
        INPUT_WORKFLOW_PROFILES_PROPERTY: ${{ inputs.workflow_profiles_property }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        github-token: ${{ inputs.token || github.token }}
        retries: 3
        script: |
          const script = require('${{ github.action_path }}/org_sync.js');
          await script({ github, context, core });

    - name: Save synchronization report
      id: report
      if: >-
        always() && !cancelled() &&
        (steps.admin.outcome != 'skipped' || steps.sync.outcome != 'skipped' || steps.runtime.outcome == 'failure')
      env:
        SYNC_ADMIN_ENABLED: ${{ inputs.properties_file != '' || inputs.admin_config != '' }}
        SYNC_ADMIN_OUTCOME: ${{ steps.admin.outcome }}
        SYNC_ADMIN_RESULTS: ${{ steps.admin.outputs.organization_results }}
        SYNC_ADMIN_CHANGED: ${{ steps.admin.outputs.changed_organizations }}
        SYNC_ADMIN_FAILED: ${{ steps.admin.outputs.failed_organizations }}
        SYNC_PREPARATION_OUTCOME: ${{ steps.runtime.outcome }}
        SYNC_DRY_RUN: ${{ inputs.dry_run }}
        SYNC_RESULTS: ${{ steps.sync.outputs.results }}
        SYNC_OUTCOME: ${{ steps.sync.outcome }}
        SYNC_CHANGED: ${{ steps.sync.outputs.changed_repositories }}
        SYNC_FAILED: ${{ steps.sync.outputs.failed_repositories }}
        SYNC_ORGANIZATION: ${{ inputs.organization }}
        SYNC_REPOSITORY: ${{ inputs.repository }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          const writeSyncReport = require('${{ github.action_path }}/report.js');
          await writeSyncReport({ core, context });

    - name: Upload synchronization report
      if: always() && !cancelled() && steps.report.outcome == 'success'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ steps.report.outputs.artifact_name }}
        path: ${{ steps.report.outputs.report_file }}
        if-no-files-found: error
        retention-days: 14
